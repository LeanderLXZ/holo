<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 362" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agentic loop flowchart">
  <style type="text/css"><![CDATA[
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
text { font-family: var(--font); }
/* dark palette — Cocoon-inspired (slate-950 + bright accent borders)
     See ../SKILL.md §Color Palette */
  :root {
    --bg:             #020617;
    --text:           #E2E8F0;
    --label-text:     #94A3B8;
    --action-fill:    rgba(6,78,59,0.4);
    --action-stroke:  #34D399;
    --agent-fill:     rgba(8,51,68,0.4);
    --agent-stroke:   #22D3EE;
    --terminal-fill:  rgba(30,41,59,0.5);
    --terminal-stroke:#94A3B8;
    --data-fill:      rgba(76,29,149,0.4);
    --data-stroke:    #A78BFA;
    --state-fill:     rgba(120,53,15,0.4);
    --state-stroke:   #FBBF24;
    --callout-fill:   rgba(251,146,60,0.25);
    --callout-stroke: #FB923C;
    --callout-text:   #FDBA74;
    --flow-line:      #94A3B8;
    --flow-loopback:  #34D399;
    --container:      #475569;
    --container-lbl:  #94A3B8;
    --font: "Inter", "Söhne", -apple-system, BlinkMacSystemFont, "Segoe UI",
            Helvetica, Arial, sans-serif;
  }

  #arrow-flow     path { fill: var(--flow-line); }
  #arrow-loopback path { fill: var(--flow-loopback); }
  #arrow-callout  path { fill: var(--callout-stroke); }

  .container-box   { fill: none; stroke: var(--container); stroke-width: 2; stroke-dasharray: 6 6; }
  .container-gap   { fill: var(--bg); }
  .container-label { font-weight: 500; font-size: 16px; fill: var(--container-lbl); letter-spacing: 0.01em; }

  .flow-arrow        { stroke: var(--flow-line); stroke-width: 4; fill: none;
                       stroke-linecap: round; stroke-linejoin: round; }
  .flow-arrow.dashed { stroke-width: 3; stroke-dasharray: 7 5; }
  .loopback-arrow    { stroke: var(--flow-loopback); stroke-width: 5; fill: none;
                       stroke-linecap: round; stroke-linejoin: round; }
  .callout-arrow     { stroke: var(--callout-stroke); stroke-width: 3; fill: none;
                       stroke-dasharray: 7 5; stroke-linecap: round; }

  .edge-label    { font-weight: 500; font-size: 13px; fill: var(--label-text); }
  .edge-label-bg { fill: var(--bg); }

  /* Dark theme: ALL roles carry an accent border (1.4px) for edge definition.
     data / state / callout bump to 2px to retain hierarchy. */
  .node-label    { font-weight: 700; font-size: 18px; fill: var(--text); }
  .node-sublabel { font-weight: 500; font-size: 12px; fill: var(--label-text); }
  .role-action   { fill: var(--action-fill);   stroke: var(--action-stroke);   stroke-width: 1.4; }
  .role-agent    { fill: var(--agent-fill);    stroke: var(--agent-stroke);    stroke-width: 1.4; }
  .role-terminal { fill: var(--terminal-fill); stroke: var(--terminal-stroke); stroke-width: 1.4; }
  .data-rect     { fill: var(--data-fill);     stroke: var(--data-stroke);     stroke-width: 2; }
  .state-rect    { fill: var(--state-fill);    stroke: var(--state-stroke);    stroke-width: 2; }

  .callout-box   { fill: var(--callout-fill); stroke: var(--callout-stroke); stroke-width: 2; }
  .callout-label { font-weight: 500; font-size: 18px; fill: var(--callout-text); }

  .legend-label  { font-weight: 500; font-size: 12px; fill: var(--label-text); }
]]></style>
  <rect width="100%" height="100%" fill="var(--bg)" />


  <defs>
    <marker id="arrow-flow" viewBox="0 0 14 12" refX="0" refY="6"
            markerWidth="14" markerHeight="12"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 14 6 L 0 12 z" />
    </marker>
    <marker id="arrow-loopback" viewBox="0 0 14 12" refX="0" refY="6"
            markerWidth="14" markerHeight="12"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 14 6 L 0 12 z" />
    </marker>
    <marker id="arrow-callout" viewBox="0 0 14 12" refX="0" refY="6"
            markerWidth="14" markerHeight="12"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 14 6 L 0 12 z" />
    </marker>
  </defs>

  <!-- Container -->
  <g class="container">
    <rect class="container-box" x="240" y="20" width="880" height="190" rx="20" ry="20" />
    <rect class="container-gap" x="620" y="10" width="120" height="20" />
    <text class="container-label" x="680" y="25" text-anchor="middle">agentic loop</text>
  </g>

  <!-- Loopback -->
  <path class="loopback-arrow"
        d="M 960,140
           L 960,166 Q 960,178 948,178
           L 422,178 Q 410,178 410,166
           L 410,154"
        marker-end="url(#arrow-loopback)" />

  <!-- Forward flow arrows -->
  <g>
    <line class="flow-arrow" x1="220" y1="110" x2="276"  y2="110" marker-end="url(#arrow-flow)" />
    <line class="flow-arrow" x1="530" y1="110" x2="586"  y2="110" marker-end="url(#arrow-flow)" />
    <line class="flow-arrow" x1="780" y1="110" x2="836"  y2="110" marker-end="url(#arrow-flow)" />
    <line class="flow-arrow" x1="1070" y1="110" x2="1126" y2="110" marker-end="url(#arrow-flow)" />
  </g>

  <!-- Callout arrow — single straight vertical -->
  <path class="callout-arrow" d="M 400,270 L 668,270 Q 680,270 680,258 L 680,224"
        marker-end="url(#arrow-callout)" />

  <!-- Nodes -->
  <rect class="role-terminal" x="20"   y="80" width="200" height="60" rx="12" ry="12" />
  <text class="node-label"    x="120"  y="117" text-anchor="middle">Your prompt</text>

  <rect class="role-terminal" x="1140" y="80" width="120" height="60" rx="12" ry="12" />
  <text class="node-label"    x="1200" y="117" text-anchor="middle">Done</text>

  <rect class="role-action"   x="290" y="80" width="240" height="60" rx="12" ry="12" />
  <text class="node-label"    x="410" y="117" text-anchor="middle">Gather context</text>

  <rect class="role-action"   x="600" y="80" width="180" height="60" rx="12" ry="12" />
  <text class="node-label"    x="690" y="117" text-anchor="middle">Take action</text>

  <rect class="role-action"   x="850" y="80" width="220" height="60" rx="12" ry="12" />
  <text class="node-label"    x="960" y="117" text-anchor="middle">Verify results</text>

  <!-- Callout box -->
  <rect class="callout-box" x="20" y="240" width="380" height="60" rx="12" ry="12" />
  <text class="callout-label" x="210" y="277" text-anchor="middle">You: interrupt, steer, or add context</text>

  <!-- Legend -->
  <g class="legend" transform="translate(40, 330)">
    <g transform="translate(0, 0)">
      <rect width="22" height="12" rx="3" fill="var(--terminal-fill)" stroke="var(--terminal-stroke)" stroke-width="1" />
      <text x="30" y="10" class="legend-label">terminal</text>
    </g>
    <g transform="translate(100, 0)">
      <rect width="22" height="12" rx="3" fill="var(--action-fill)" stroke="var(--action-stroke)" stroke-width="1" />
      <text x="30" y="10" class="legend-label">action</text>
    </g>
    <g transform="translate(180, 0)">
      <rect width="22" height="12" rx="3" fill="var(--callout-fill)" stroke="var(--callout-stroke)" stroke-width="1.4" />
      <text x="30" y="10" class="legend-label">callout</text>
    </g>
  </g>


</svg>
